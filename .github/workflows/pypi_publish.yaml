name: Publish Python 🐍 sdwire 📦 to PyPI and TestPyPI
on: push
jobs:
  build:
    name: Build SDWire CLI App.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install pipx
        run: |
          sudo apt update
          sudo apt install pipx
          pipx ensurepath
      - name: Install Poetry
        run: |
          pipx install poetry==1.8.3
      - name: Build
        run: |
          poetry build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-sdwire-dists
          path: dist/
  e2e-wheel:
    name: E2E tests (simulated) of the wheel on Python ${{ matrix.python-version }}
    needs:
      - build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download dists
        uses: actions/download-artifact@v4
        with:
          name: python-sdwire-dists
          path: dist/
      - name: Install umockdev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            umockdev gir1.2-umockdev-1.0 python3-gi python3-venv
      - name: Install the CLI under test from the wheel
        run: |
          python -m venv /tmp/sut
          /tmp/sut/bin/pip install dist/*.whl
      - name: Install the test harness
        run: |
          # system python, so the harness can import gi from python3-gi
          /usr/bin/python3 -m venv --system-site-packages /tmp/harness
          pipx install poetry
          # only the locked e2e group, the CLI under test comes from the wheel
          VIRTUAL_ENV=/tmp/harness poetry install --only e2e --no-root
      - name: Run e2e tests
        env:
          SDWIRE_CMD: /tmp/sut/bin/sdwire
        run: umockdev-wrapper /tmp/harness/bin/pytest tests/e2e --backend=sim
  pypi-publish:
    name: Publish Python 🐍 sdwire 📦 to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # only publish to PyPI on tag pushes
    needs:
      - build
      - e2e-wheel
    environment:
      name: pypi
      url: https://pypi.org/p/sdwire
    permissions:
      id-token: write
    steps:
      - name: Download dists
        uses: actions/download-artifact@v4
        with:
          name: python-sdwire-dists
          path: dist/
      - name: Publish sdwire 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
  test-pypi-publish:
    name: Publish Python 🐍 sdwire 📦 to TestPyPI
    needs:
      - build
      - e2e-wheel
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sdwire
    permissions:
      id-token: write
    steps:
      - name: Download dists
        uses: actions/download-artifact@v4
        with:
          name: python-sdwire-dists
          path: dist/
      - name: Publish sdwire 📦 to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
  github-release:
    name: >-
      Sign the Python 🐍 sdwire 📦 with Sigstore and upload them to GitHub Release
    needs:
      - pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # IMPORTANT: mandatory for making GitHub Releases
      id-token: write # IMPORTANT: mandatory for sigstore
    steps:
      - name: Download dists
        uses: actions/download-artifact@v4
        with:
          name: python-sdwire-dists
          path: dist/
      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: >-
            ./dist/*.tar.gz ./dist/*.whl
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create '${{ github.ref_name }}' --repo '${{ github.repository }}' --notes ""
      - name: Upload artifact signatures to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Upload to GitHub Release using the `gh` CLI.
        # `dist/` contains the built packages, and the
        # sigstore-produced signatures and certificates.
        run: >-
          gh release upload '${{ github.ref_name }}' dist/** --repo '${{ github.repository }}'
